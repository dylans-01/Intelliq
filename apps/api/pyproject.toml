[project]
name = "intelliq"
version = "0.1.0"
description = "Intelliq — independent BI platform: semantic layer, query and calculation engine, dashboards, Tableau migration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "sqlglot>=26",
  "duckdb>=1.1",
  "defusedxml>=0.7",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
sqlserver = ["pyodbc>=5.0"]
snowflake = ["snowflake-connector-python>=3.6"]
databricks = ["databricks-sql-connector>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
intelliq = "intelliq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intelliq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "intelliq.api.deps.require"]
